name: Snapshot

on:
  push:
    branches:
      - main

concurrency:
  group: snapshot-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -shuffle=on -count=1 ./...

      - name: Build Windows executable
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path dist
          go build -trimpath -ldflags "-s -w" -o dist/cpa-codex-auth-windows-amd64.exe .

      - name: Update Snapshot Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: snapshot
          name: Snapshot $$-${{ github.run_id }}
          prerelease: true
          body: Automated snapshot build from main at ${{ github.sha }}.
          files: dist/cpa-codex-auth-windows-amd64.exe
