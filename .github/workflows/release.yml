name: Snapshot

on:
  push:
    branches:
      - main

concurrency:
  group: snapshot-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -shuffle=on -count=1 ./...

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@v6
        env:
          GORELEASER_CURRENT_TAG: v0.0.0-snapshot
          GORELEASER_PREVIOUS_TAG: v0.0.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Update Snapshot Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: snapshot
          name: Snapshot $$-${{ github.run_id }}
          prerelease: true
          body: Automated snapshot build from main at ${{ github.sha }}.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
