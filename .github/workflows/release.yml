name: Snapshot

on:
  push:
    branches:
      - main

concurrency:
  group: snapshot-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -shuffle=on -count=1 ./...

      - name: Build Windows executable
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path dist
          go build -trimpath -ldflags "-s -w" -o dist/cpa-codex-auth-windows-amd64.exe .

      - name: Replace snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs/tags/snapshot" --method PATCH --field sha="${{ github.sha }}" --raw-field force=true 2>$null
          if ($LASTEXITCODE -ne 0) {
            $global:LASTEXITCODE = 0
            gh api "repos/${{ github.repository }}/git/refs" --method POST --field ref="refs/tags/snapshot" --field sha="${{ github.sha }}"
          }
          gh release view snapshot 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit snapshot --target "${{ github.sha }}" --title "Snapshot" --notes "Automated snapshot build from main at ${{ github.sha }}." --prerelease
            gh release upload snapshot "dist/cpa-codex-auth-windows-amd64.exe" --clobber
          } else {
            $global:LASTEXITCODE = 0
            gh release create snapshot "dist/cpa-codex-auth-windows-amd64.exe" --verify-tag --title "Snapshot" --notes "Automated snapshot build from main at ${{ github.sha }}." --prerelease
          }
