version: 2

project_name: cpa-codex-auth

builds:
  - id: cpa-codex-auth
    main: .
    binary: cpa-codex-auth
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: binaries
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  disable: true
